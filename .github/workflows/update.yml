name: Update UNIVE calendars

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Generate calendars
        run: python generate_unive_calendars.py

      - name: Commit & push if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "bot@github.com"
          git add *.ics
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update calendars"
          git push
